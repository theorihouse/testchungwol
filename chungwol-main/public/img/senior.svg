<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 640">
  <!-- 선임 NPC 임시 일러스트 (기획서 19장: 30대 중반 남성, 짧은 검정 스포츠머리, 차콜 정장, 흰 셔츠, 남색 넥타이, 목걸이형 사원증). 관리자 페이지에서 교체 가능 -->
